name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Every route in this app is fully dynamic (session-cookie-gated, no
      # generateStaticParams/force-static anywhere) — next build never
      # queries the database at build time, so a placeholder connection
      # string is enough for Prisma Client to initialize. No real DB
      # secret needed here.
      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run build
